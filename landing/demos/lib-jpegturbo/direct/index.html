<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>crossbind - jpegturbo from JavaScript only</title>
    <script src="./dist/jpegturbodirect-wasm-wasm32-st-release.browser.js"></script>
</head>

<body>
    <pre id="out">compiling ...</pre>
    <script type="module">
        // The "JavaScript only" versions of the usage examples on crossbind.dev/ports/jpegturbo/: no C++,
        // only the headers the libjpeg-turbo port ships as crossbind binds them. The demo build opens this
        // page; every example that can work this way must print exactly its `expected`. One that cannot
        // says why instead and has nothing to run.
        import * as encode from './examples/01-encode.js';
        import * as decode from './examples/02-decode.js';
        import * as thumbnail from './examples/03-thumbnail.js';
        import * as transcode from './examples/04-transcode.js';
        import * as markers from './examples/05-markers.js';
        import nativeVersions from './native-versions.js';

        const EXAMPLES = [encode, decode, thumbnail, transcode, markers].filter((example) => example.default);
        const expectedOf = (example) => (typeof example.expected === 'function' ? example.expected(nativeVersions) : example.expected);

        const out = document.querySelector('#out');
        const lines = [];
        const show = (text) => {
            lines.push(text);
            out.textContent = lines.join('\n');
        };
        const checks = [];
        const check = (name, actual, expected) => {
            const ok = JSON.stringify(actual) === JSON.stringify(expected);
            checks.push(ok);
            show(`${ok ? 'ok  ' : 'FAIL'} ${name}: ${JSON.stringify(actual)}${ok ? '' : ` (expected ${JSON.stringify(expected)})`}`);
        };

        try {
            const m = await initNative({ path: './dist' });
            for (const example of EXAMPLES) {
                const printed = [];
                await example.default(m, { log: (...values) => printed.push(values.map(String).join(' ')) });
                check(`example "${expectedOf(example)[0]}"`, printed, expectedOf(example));
            }
            const passed = checks.filter(Boolean).length;
            const version = await m.LIBJPEG_TURBO_VERSION_NUMBER;
            show(`jpegturbo ${Math.floor(version / 1e6)}.${Math.floor(version / 1e3) % 1e3}.${version % 1e3} => ${passed}/${checks.length} checks passed`);
        } catch (error) {
            show(`failed => ${error?.stack ?? error}`);
        }
    </script>
</body>

</html>
