[package]
name = "demo"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1"
# Live JS values (JsValue/JsFunction) - the one deliberate cpp.js coupling of this surface.
embind-rs = { path = "../crate" }

[dev-dependencies]
# Plain `cargo test` has no cpp.js host; the feature links panicking emval stand-ins.
embind-rs = { path = "../crate", features = ["host-stubs"] }
