name: test node addon conformance
on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - core/crossbind/**
            - core/embind-jsi/**
            - core/embind-napi/**
            - core/embind-rust/**
            - core/app-host/**
            - plugins/vite/**
            - plugins/rollup/**
            - e2e/backend-nodejs-native/**
            - e2e/desktop-app/**
            - e2e/conformance/**
            - e2e/conformance-rust/**
            - .nvmrc
            - .github/workflows/test-node-addon-conformance.yml
    pull_request:
        branches:
            - main
        paths:
            - core/crossbind/**
            - core/embind-jsi/**
            - core/embind-napi/**
            - core/embind-rust/**
            - core/app-host/**
            - plugins/vite/**
            - plugins/rollup/**
            - e2e/backend-nodejs-native/**
            - e2e/desktop-app/**
            - e2e/conformance/**
            - e2e/conformance-rust/**
            - .nvmrc
            - .github/workflows/test-node-addon-conformance.yml

permissions: {}
jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Build the Linux and Windows addons
              # C++ and Rust alike: the kit's Rust packages and the crates the suite imports build in the
              # linux and windows images too.
              run: pnpm run ci:linux:build:conformance
            - name: Keep the addons for the runners that load them
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: node-addon-conformance
                  if-no-files-found: error
                  # A re-run of this job uploads under the same name again.
                  overwrite: true
                  # The suite checks that every kit export it reaches was bound, from the build's bridge exports;
                  # the app leg builds from the bridges and interfaces themselves.
                  include-hidden-files: true
                  # dist/node holds the addon's entry and the import hooks the suite runs under.
                  path: |
                      e2e/backend-nodejs-native/dist/*.node
                      e2e/backend-nodejs-native/dist/*.cjs
                      e2e/backend-nodejs-native/dist/node/
                      e2e/backend-nodejs-native/.crossbind/cache.json
                      e2e/backend-nodejs-native/.crossbind/build/bridge/
                      e2e/backend-nodejs-native/.crossbind/build/interface/
                  retention-days: 1
    run:
        # Linux runs the glibc and musl addons in containers; a hosted Windows runner cannot run the
        # Linux images, so each Windows runner loads the addon built for it.
        needs: build
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { runner: ubuntu-latest, arch: x64 }
                    - { runner: windows-latest, arch: x64 }
                    - { runner: windows-11-arm, arch: arm64 }
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  # An emulated x64 Node.js would load the x64 addon on the arm64 runner.
                  architecture: ${{ matrix.arch }}
            - name: Install the conformance kit
              # The suite imports the kit; nothing is built on these runners.
              run: pnpm install --frozen-lockfile --prod --filter "@crossbind/e2e-backend-nodejs-native..."
            - name: Restore the addons
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: node-addon-conformance
                  path: e2e/backend-nodejs-native
            - name: Run the conformance suite
              run: node e2e/backend-nodejs-native/e2e/run.mjs
    app:
        # A macOS runner has no Docker to run SWIG in, so the app leg builds from the addon's bridges: it binds
        # the same headers with the same names.
        needs: build
        runs-on: macos-latest
        timeout-minutes: 60
        env:
            # The leg's crate imports are resolved with cargo metadata, which runs in the image unless the runner
            # is LOCAL.
            CROSSBIND_RUNNER: LOCAL
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Restore the addon build
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: node-addon-conformance
                  path: e2e/backend-nodejs-native
            - name: Take its bridges under the app leg's paths
              working-directory: e2e/desktop-app
              run: |
                  mkdir -p .crossbind/build
                  cp -r ../backend-nodejs-native/.crossbind/build/bridge ../backend-nodejs-native/.crossbind/build/interface .crossbind/build/
                  cp ../backend-nodejs-native/.crossbind/cache.json .crossbind/
                  sed -i '' -e 's#/home/runner/work/#/Users/runner/work/#g' -e 's#/e2e/backend-nodejs-native/#/e2e/desktop-app/#g' \
                      .crossbind/cache.json .crossbind/build/bridge/*.source .crossbind/build/bridge/*.deps
            - name: Build the app and run the conformance suite in it
              run: |
                  pnpm --filter=@crossbind/e2e-desktop-app run build
                  pnpm --filter=@crossbind/e2e-desktop-app run e2e:prod
    app-ios:
        # The iOS app builds on a macOS runner from the addon's bridges as the macOS app does, its Rust for both
        # iOS SDKs, and runs in the Simulator.
        needs: build
        runs-on: macos-latest
        timeout-minutes: 60
        env:
            CROSSBIND_RUNNER: LOCAL
            CROSSBIND_APP_PLATFORM: ios
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Add Rust's iOS targets
              run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
            - name: Restore the addon build
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: node-addon-conformance
                  path: e2e/backend-nodejs-native
            - name: Take its bridges under the app leg's paths
              working-directory: e2e/desktop-app
              run: |
                  mkdir -p .crossbind/build
                  cp -r ../backend-nodejs-native/.crossbind/build/bridge ../backend-nodejs-native/.crossbind/build/interface .crossbind/build/
                  cp ../backend-nodejs-native/.crossbind/cache.json .crossbind/
                  sed -i '' -e 's#/home/runner/work/#/Users/runner/work/#g' -e 's#/e2e/backend-nodejs-native/#/e2e/desktop-app/#g' \
                      .crossbind/cache.json .crossbind/build/bridge/*.source .crossbind/build/bridge/*.deps
            - name: Build the app and run the conformance suite in the Simulator
              run: |
                  pnpm --filter=@crossbind/e2e-desktop-app run build
                  pnpm --filter=@crossbind/e2e-desktop-app run e2e:prod
    app-linux:
        # The app builds in crossbind's linux image, as the addons do, with Hermes and WebKitGTK's headers and
        # libraries fetched on first use, and runs on the runner's own WebKitGTK.
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Install WebKitGTK, which the app runs on
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0
            - name: Build the app and run the conformance suite in it
              # WebKitGTK runs without its sandbox and GPU compositing, as in the containers the app was measured in.
              env:
                  WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
                  WEBKIT_DISABLE_COMPOSITING_MODE: '1'
              run: |
                  pnpm --filter=@crossbind/e2e-desktop-app run build
                  xvfb-run -a pnpm --filter=@crossbind/e2e-desktop-app run e2e:prod
    app-android:
        # The Android app's host and Rust build in crossbind's android image, its bridges in the web image, and Gradle
        # packages the app, which runs on an emulator.
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            CROSSBIND_APP_PLATFORM: android
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
              with:
                  distribution: 'temurin'
                  java-version: '17'
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Build the app
              run: pnpm --filter=@crossbind/e2e-desktop-app run build
            - name: Enable KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
            - name: Run the conformance suite in the app on an emulator
              uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              with:
                  api-level: 36
                  target: default
                  arch: x86_64
                  emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
                  disable-animations: true
                  script: pnpm --filter=@crossbind/e2e-desktop-app run e2e:prod
