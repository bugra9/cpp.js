name: spike windows apps
# The Windows apps spike's own runs, on pushes to its branch alone: what builds in crossbind's windows image on Linux,
# run on Windows for x64 and arm64.
on:
    push:
        branches:
            - test/app-host/windows-apps-spike

permissions: {}
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Build Hermes and the smoke tests in crossbind's windows image
              run: |
                  mkdir -p out
                  image=ghcr.io/crossbind/windows@sha256:040fb03c9c78185a897f2a70fb1771052e230b35cea5992f6aed72a6fdd6067a
                  docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo:ro" -v "$PWD/out:/out" "$image" bash /repo/spike/windows/build.sh /out
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: windows-spike
                  path: |
                      out/x64/*.exe
                      out/arm64/*.exe
                      out/smoke.hbc
    app:
        # The conformance leg built for Windows by crossbind itself, in the spike's windows image.
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install
            - name: Build the spike's windows image
              run: docker build -f spike/windows/windows-app.Dockerfile -t crossbind/windows-app:spike spike/windows
            - name: Build the conformance app for Windows
              env:
                  CROSSBIND_IMAGE_WINDOWS: crossbind/windows-app:spike
              run: pnpm --filter=@crossbind/e2e-desktop-app exec crossbind app build -p windows
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: windows-app
                  path: |
                      e2e/desktop-app/dist/crossbind-e2e-desktop-app-win32-x64/
                      e2e/desktop-app/dist/crossbind-e2e-desktop-app-win32-arm64/
    run:
        needs: [build, app]
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: windows-latest, arch: x64 }
                    - { os: windows-11-arm, arch: arm64 }
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: windows-spike
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: windows-app
                  path: app
            - name: Run Hermes on Windows
              shell: pwsh
              run: |
                  & ".\${{ matrix.arch }}\hermes-smoke.exe" smoke.hbc
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - name: Install the WebView2 Runtime where the runner has none
              shell: pwsh
              run: |
                  $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
                  $version = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
                  if (-not $version) {
                      Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile webview2-setup.exe
                      Start-Process -Wait -FilePath .\webview2-setup.exe -ArgumentList '/silent', '/install'
                      $version = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
                  }
                  "WebView2 Runtime: $version"
            - name: Run the platform layer on WebView2
              shell: pwsh
              run: |
                  & ".\${{ matrix.arch }}\webview-smoke.exe"
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - name: Run the conformance suite in the app
              shell: pwsh
              run: |
                  $env:CROSSBIND_APP_CONSOLE = '1'
                  $app = ".\app\crossbind-e2e-desktop-app-win32-${{ matrix.arch }}\crossbind-e2e-desktop-app.exe"
                  $process = Start-Process -FilePath $app -PassThru -RedirectStandardOutput app.out -RedirectStandardError app.err
                  $deadline = (Get-Date).AddMinutes(5)
                  while ((Get-Date) -lt $deadline -and -not $process.HasExited) {
                      if ((Test-Path app.out) -and (Select-String -Path app.out -Pattern '^CONFORMANCE' -Quiet)) { break }
                      Start-Sleep -Seconds 2
                  }
                  if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
                  Get-Content app.out, app.err
                  $summary = Select-String -Path app.out -Pattern '^CONFORMANCE (\d+)/(\d+)' | Select-Object -First 1
                  if (-not $summary -or $summary.Matches[0].Groups[1].Value -ne $summary.Matches[0].Groups[2].Value) { exit 1 }
