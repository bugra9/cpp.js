version: 2

updates:
    # One lockfile owns the complete pnpm workspace. Keep routine updates grouped,
    # while majors remain isolated so their migration cost is visible.
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: daily
          time: '02:11'
          timezone: Europe/Istanbul
      open-pull-requests-limit: 10
      # Expo SDK packages move together through `npx expo install --fix`; a per-package bump
      # desynchronises the SDK, so the Expo sample's manifest is left to that.
      exclude-paths:
          - examples/mobile-reactnative-expo/**
      versioning-strategy: increase-if-necessary
      labels:
          - dependencies
          - javascript
      ignore:
          # React Native 0.88 compiles with Babel 7. Inside the workspace @crossbind/plugin-metro
          # keeps its own Babel 7, so a Babel 8 major passes CI while it breaks every React Native
          # project create-crossbind scaffolds. Lift this once React Native moves to Babel 8.
          - dependency-name: '@babel/*'
            update-types:
                - version-update:semver-major
          # The React Native samples stay on ESLint 8 like React Native's own template: its
          # eslint-config accepts ESLint 8 and 9 only, and ESLint 10 no longer reads .eslintrc.js.
          # The rule covers the whole workspace, so a root ESLint major is now done by hand.
          - dependency-name: eslint
            update-types:
                - version-update:semver-major
          # The React Native CLI samples, the only workspace packages on TypeScript besides the Expo
          # sample this entry leaves alone, take the one React Native's own template pins. TypeScript 7
          # ships no compiler API, and the @typescript-eslint behind its eslint-config accepts
          # TypeScript below 6.1 only. Lift this once React Native's template moves to TypeScript 7.
          - dependency-name: typescript
            update-types:
                - version-update:semver-major
          # The React Native samples compile their Android bundle with the hermes-compiler they declare, and it
          # must be the version react-native depends on, or the app crashes at launch on the bytecode version.
          # It moves with a react-native bump instead; scripts/check-hermes-compiler.mjs fails until it does.
          - dependency-name: hermes-compiler
      groups:
          # Families that must move together, whatever the update type: a vitest 5 PR without
          # @vitest/coverage-v8 5, or a react-native bump without its @react-native/* dev
          # packages, cannot pass CI on its own. Dependabot assigns a dependency to the first
          # matching group, so these come first.
          vitest:
              applies-to: version-updates
              patterns:
                  - vitest
                  - '@vitest/*'
          react-native:
              applies-to: version-updates
              patterns:
                  - react-native
                  - '@react-native/*'
                  - '@react-native-community/*'
          production-minor-patch:
              applies-to: version-updates
              dependency-type: production
              update-types:
                  - minor
                  - patch
          development-minor-patch:
              applies-to: version-updates
              dependency-type: development
              update-types:
                  - minor
                  - patch
          production-security:
              applies-to: security-updates
              dependency-type: production
              patterns:
                  - '*'
          development-security:
              applies-to: security-updates
              dependency-type: development
              patterns:
                  - '*'

    # Actions remain full-SHA pinned. Dependabot moves the SHA and its human-readable
    # version comment together; repository release tests reject floating references.
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: daily
          time: '02:23'
          timezone: Europe/Istanbul
      open-pull-requests-limit: 5
      labels:
          - dependencies
          - github-actions
      groups:
          actions-minor-patch:
              applies-to: version-updates
              patterns:
                  - '*'
              update-types:
                  - minor
                  - patch
          actions-security:
              applies-to: security-updates
              patterns:
                  - '*'

    # Transactional toolchain images (Node, Rust and Emscripten) are deliberately
    # excluded here: scripts/dependencies updates their version, digest and related
    # checksums as one unit. Debian is safe for Dependabot to refresh by digest.
    - package-ecosystem: docker
      directory: /tooling/docker
      schedule:
          interval: daily
          time: '02:37'
          timezone: Europe/Istanbul
      open-pull-requests-limit: 3
      labels:
          - dependencies
          - toolchain
          - security
      allow:
          - dependency-name: debian
